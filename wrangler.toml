# wrangler.toml — Trade Risk Calculator (+ Portfolio Vibe backend)
# DEFINITIVE VERSION (25-Jl-26) — real database_id baked in; the placeholder
# that caused the 10021/duplicate-key outage is permanently retired.

name = "trade-risk-calculator-app"
main = "worker.js"
compatibility_date = "2025-06-01"

# ── Static frontend ────────────────────────────────────────────────────────── 
[assets]
directory = "public"
binding = "ASSETS"

# ── Portfolio Vibe: D1 (global tables — handles, rooms, modtrail…) ───────────
[[d1_databases]]
binding = "VIBE_DB"
database_name = "portfolio-vibe"
database_id = "65d722a5-904a-4e93-8951-5bc8bfa15a18"

# ── Portfolio Vibe: Durable Objects (live rooms) ───────────────────────────── 
[[durable_objects.bindings]]
name = "VIBE_ROOM"
class_name = "VibeRoom"

# SQLite-backed DO migration — free-plan per-room SQLite. Tag v1 never reused.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VibeRoom"]

# ── Observability (RECEIPTS LAW, 24-Jl-26 — permanent) ───────────────────────
# Any future supersede of this file MUST carry this block: config outranks the
# dashboard toggle, so a toml without it silently switches receipts back off
# on the next deploy. Analytics is the gauge; these logs are the record.
[observability.logs]
enabled = true
invocation_logs = true
